[project]
name = "ground-station"
version = "0.1.0"
description = "UTD Comet Rocketry SRAD ground station backend (telemetry ingest, logging, WebSocket feed)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
ground-station = "ground_station.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ground_station*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
